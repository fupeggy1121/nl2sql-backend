services:
  - type: web
    name: nl2sql-backend
    runtime: python311
    pythonVersion: 3.11.9
    buildCommand: pip install -r requirements.txt
    # Phase E: 切换到 FastAPI + uvicorn（保留 gunicorn 作为注释备选）
    # 旧命令: gunicorn --bind 0.0.0.0:$PORT run:app
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 2
    healthCheckPath: /health
    envVars:
      - key: FLASK_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: PORT
        value: $PORT
      - key: DEEPSEEK_API_KEY
        sync: false
      - key: DEEPSEEK_BASE_URL
        value: https://api.deepseek.com
      - key: DEEPSEEK_MODEL
        value: deepseek-chat
      - key: LLM_PROVIDER
        value: deepseek
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_KEY
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: DB_HOST
        sync: false
      - key: DB_PORT
        value: "5432"
      - key: DB_USER
        sync: false
      - key: DB_PASSWORD
        sync: false
      - key: DB_NAME
        sync: false
